name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.pkg }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            pkg: win32-x64
            bin: delim-doctor.exe
            cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            pkg: win32-arm64
            bin: delim-doctor.exe
            cross: false
            skip_test: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            pkg: darwin-x64
            bin: delim-doctor
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            pkg: darwin-arm64
            bin: delim-doctor
            cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            pkg: linux-x64-gnu
            bin: delim-doctor
            cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            pkg: linux-x64-musl
            bin: delim-doctor
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            pkg: linux-arm64-gnu
            bin: delim-doctor
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            pkg: linux-arm64-musl
            bin: delim-doctor
            cross: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Test
        if: ${{ !matrix.cross && !matrix.skip_test }}
        run: cargo test --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "npm/platforms/${{ matrix.pkg }}/bin"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
             "npm/platforms/${{ matrix.pkg }}/bin/${{ matrix.bin }}"

      - name: Stage raw binary for GitHub Release
        shell: bash
        run: |
          mkdir -p release
          BIN="delim-doctor-${{ matrix.target }}"
          if [[ "${{ matrix.bin }}" == *.exe ]]; then BIN="${BIN}.exe"; fi
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "release/${BIN}"

      - name: Upload platform package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pkg }}
          path: npm/platforms/${{ matrix.pkg }}
          if-no-files-found: error

      - name: Upload raw binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: release/delim-doctor-*

  github-release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true

      - name: List binaries
        run: ls -la binaries/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets"
            gh release upload "$TAG" binaries/* --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --generate-notes \
              --title "$TAG" \
              binaries/*
          fi

  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Clear platform packages
        run: rm -rf npm/platforms

      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          path: npm/platforms

      - name: Sync versions from Cargo.toml
        run: node scripts/sync-version.mjs

      - name: Verify tag matches version
        shell: bash
        run: |
          version=$(node -p "require('./npm/delim-doctor/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Publish platform packages then main package
        run: node scripts/publish.mjs
        env:
          NPM_CONFIG_PROVENANCE: "true"
