name: Release

# Continuous Delivery — builds 8 platforms, creates GitHub Release, publishes to npm.
#
# Triggers:
#   1. workflow_dispatch (manual) — admin clicks "Run workflow" on Actions page.
#      Optional input: tag name. If empty, reads version from Cargo.toml.
#   2. push: tags ["v*"] — manual `git tag v0.2.0 && git push origin v0.2.0`
#   3. schedule (weekly Monday 09:00 UTC) — auto-releases if Cargo.toml version
#      differs from latest tag. If same, skips silently.
#
# CI (fmt + clippy + test) runs separately in ci.yml on every PR and push to main.
# This workflow only runs on explicit release triggers.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v0.3.0). Leave empty to use Cargo.toml version."
        required: false
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Resolve tag: determine which tag to release, create if missing ────────
  resolve-tag:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        run: |
          # Priority: input > tag push (GITHUB_REF_NAME) > Cargo.toml
          INPUT_TAG="${{ inputs.tag }}"
          if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
            if [ -z "$VERSION" ]; then
              echo "Could not extract version from Cargo.toml"
              exit 1
            fi
            TAG="v${VERSION}"
          fi

          # Ensure v prefix
          TAG="${TAG#v}"
          TAG="v${TAG}"
          VERSION="${TAG#v}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # On schedule: skip if tag already exists (no new version to release)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists — nothing to release"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

          # Create tag if it doesn't exist (workflow_dispatch path)
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Creating tag $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" -m "Release $VERSION"
            git push origin "$TAG"
          else
            echo "Tag $TAG already exists — will release"
          fi

  # ── Build: 8-platform parallel build + test ──────────────────────────────
  build:
    name: build ${{ matrix.pkg }}
    needs: resolve-tag
    if: needs.resolve-tag.outputs.should_run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            pkg: win32-x64
            bin: delim-doctor.exe
            cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            pkg: win32-arm64
            bin: delim-doctor.exe
            cross: false
            skip_test: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            pkg: darwin-x64
            bin: delim-doctor
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            pkg: darwin-arm64
            bin: delim-doctor
            cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            pkg: linux-x64-gnu
            bin: delim-doctor
            cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            pkg: linux-x64-musl
            bin: delim-doctor
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            pkg: linux-arm64-gnu
            bin: delim-doctor
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            pkg: linux-arm64-musl
            bin: delim-doctor
            cross: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Test
        if: ${{ !matrix.cross && !matrix.skip_test }}
        run: cargo test --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "npm/platforms/${{ matrix.pkg }}/bin"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
             "npm/platforms/${{ matrix.pkg }}/bin/${{ matrix.bin }}"

      - name: Stage raw binary for GitHub Release
        shell: bash
        run: |
          mkdir -p release
          BIN="delim-doctor-${{ matrix.target }}"
          if [[ "${{ matrix.bin }}" == *.exe ]]; then BIN="${BIN}.exe"; fi
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "release/${BIN}"

      - name: Upload platform package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pkg }}
          path: npm/platforms/${{ matrix.pkg }}
          if-no-files-found: error

      - name: Upload raw binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: release/delim-doctor-*

  # ── GitHub Release: auto-generated notes + binary downloads ───────────────
  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true

      - name: List binaries
        run: ls -la binaries/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets"
            gh release upload "$TAG" binaries/* --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --generate-notes \
              --title "$TAG" \
              binaries/*
          fi

  # ── npm publish: platform packages + main package ─────────────────────────
  publish:
    name: npm publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Clear platform packages
        run: rm -rf npm/platforms

      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          path: npm/platforms

      - name: Sync versions from Cargo.toml
        run: node scripts/sync-version.mjs

      - name: Verify tag matches version
        shell: bash
        run: |
          version=$(node -p "require('./npm/delim-doctor/package.json').version")
          TAG="${{ needs.resolve-tag.outputs.version }}"
          if [ "$version" != "$TAG" ]; then
            echo "tag version $TAG does not match package version $version"
            exit 1
          fi

      - name: Publish platform packages then main package
        run: node scripts/publish.mjs
        env:
          NPM_CONFIG_PROVENANCE: "true"
