name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.pkg }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            pkg: win32-x64
            bin: delim-doctor.exe
            cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            pkg: win32-arm64
            bin: delim-doctor.exe
            cross: false
          - target: x86_64-apple-darwin
            os: macos-13
            pkg: darwin-x64
            bin: delim-doctor
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            pkg: darwin-arm64
            bin: delim-doctor
            cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            pkg: linux-x64-gnu
            bin: delim-doctor
            cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            pkg: linux-x64-musl
            bin: delim-doctor
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            pkg: linux-arm64-gnu
            bin: delim-doctor
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            pkg: linux-arm64-musl
            bin: delim-doctor
            cross: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "npm/platforms/${{ matrix.pkg }}/bin"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
             "npm/platforms/${{ matrix.pkg }}/bin/${{ matrix.bin }}"

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: npm/platforms/${{ matrix.pkg }}
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Clear platform packages
        run: rm -rf npm/platforms

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: npm/platforms

      - name: Sync versions from Cargo.toml
        run: node scripts/sync-version.mjs

      - name: Verify tag matches version
        shell: bash
        run: |
          version=$(node -p "require('./npm/delim-doctor/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Publish platform packages then main package
        run: node scripts/publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
