name: Release

# Combined workflow: auto-tag + build + GitHub Release + npm publish
#
# Triggers:
#   1. Push to main → auto-tag detects Cargo.toml version → creates tag
#      → build → GitHub Release → npm publish (all in one run)
#   2. Manual tag push (v*) → skip auto-tag → build → release → publish
#   3. workflow_dispatch → build only (for testing, no release/publish)
#
# NOTE: GitHub Actions does NOT trigger workflows from tags pushed by
# GITHUB_TOKEN. Combining auto-tag + release into one workflow avoids
# this limitation entirely.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Auto-tag: on branch push, create tag if version changed ──────────────
  auto-tag:
    name: Auto-tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not extract version from Cargo.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping release"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

  # ── Build: runs if auto-tag created a tag, or on manual tag push ──────────
  build:
    name: build ${{ matrix.pkg }}
    needs: auto-tag
    if: always() && (needs.auto-tag.result == 'skipped' || needs.auto-tag.outputs.should_release == 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            pkg: win32-x64
            bin: delim-doctor.exe
            cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            pkg: win32-arm64
            bin: delim-doctor.exe
            cross: false
            skip_test: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            pkg: darwin-x64
            bin: delim-doctor
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            pkg: darwin-arm64
            bin: delim-doctor
            cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            pkg: linux-x64-gnu
            bin: delim-doctor
            cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            pkg: linux-x64-musl
            bin: delim-doctor
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            pkg: linux-arm64-gnu
            bin: delim-doctor
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            pkg: linux-arm64-musl
            bin: delim-doctor
            cross: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Test
        if: ${{ !matrix.cross && !matrix.skip_test }}
        run: cargo test --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "npm/platforms/${{ matrix.pkg }}/bin"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
             "npm/platforms/${{ matrix.pkg }}/bin/${{ matrix.bin }}"

      - name: Stage raw binary for GitHub Release
        shell: bash
        run: |
          mkdir -p release
          BIN="delim-doctor-${{ matrix.target }}"
          if [[ "${{ matrix.bin }}" == *.exe ]]; then BIN="${BIN}.exe"; fi
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "release/${BIN}"

      - name: Upload platform package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pkg }}
          path: npm/platforms/${{ matrix.pkg }}
          if-no-files-found: error

      - name: Upload raw binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: release/delim-doctor-*

  # ── GitHub Release: auto-generated notes + binary downloads ───────────────
  github-release:
    name: GitHub Release
    needs: build
    if: always() && needs.build.result == 'success' && (needs.auto-tag.outputs.should_release == 'true' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine tag
        id: tag
        run: |
          TAG="${{ needs.auto-tag.outputs.tag }}"
          if [ -z "$TAG" ] || [ "$TAG" = "" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true

      - name: List binaries
        run: ls -la binaries/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets"
            gh release upload "$TAG" binaries/* --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --generate-notes \
              --title "$TAG" \
              binaries/*
          fi

  # ── npm publish: platform packages + main package ─────────────────────────
  publish:
    name: npm publish
    needs: build
    if: always() && needs.build.result == 'success' && (needs.auto-tag.outputs.should_release == 'true' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Determine tag
        id: tag
        run: |
          TAG="${{ needs.auto-tag.outputs.tag }}"
          if [ -z "$TAG" ] || [ "$TAG" = "" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Clear platform packages
        run: rm -rf npm/platforms

      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          path: npm/platforms

      - name: Sync versions from Cargo.toml
        run: node scripts/sync-version.mjs

      - name: Verify tag matches version
        shell: bash
        run: |
          version=$(node -p "require('./npm/delim-doctor/package.json').version")
          TAG="${{ steps.tag.outputs.tag }}"
          tag="${TAG#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $TAG does not match package version $version"
            exit 1
          fi

      - name: Publish platform packages then main package
        run: node scripts/publish.mjs
        env:
          NPM_CONFIG_PROVENANCE: "true"
