[package]
name = "delim-doctor"
version = "0.1.2"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
rmcp = { version = "=3.2.0", features = ["server", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
serde_json = "1.0.145"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "io-std"] }
